# Empty uses the Helm release namespace; an override must already exist.
namespaceOverride: ""

replicas: 3
leaderElection: true

image:
  registry: container-registry.oracle.com
  repository: database/operator
  # An empty tag uses Chart.appVersion; a digest takes precedence over the tag.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# One OCI profile per entry, in the database resource's existing namespace.
# Supply privateKey with --set-file, or select existingSecretName.
ociCredentials: []

scope:
  mode: cluster
  # Required in namespace mode. These namespaces must already exist.
  watchNamespaces: []

rbac:
  create: true
  # PV management and Namespace/StorageClass reads in either scope mode.
  clusterResources: true
  # Node list/watch access for NodePort services.
  nodeAccess: false

serviceAccount:
  create: true
  # Defaults to oracle-database-operator; required when create is false.
  name: ""
  annotations: {}

# Patches native CRD certificate and conversion references after install/upgrade.
crdConfiguration:
  # Enable in one release per cluster to manage shared CRD references.
  enabled: true
  image: registry.k8s.io/kubectl:v1.36.3
  imagePullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

resources:
  requests:
    cpu: 400m
    memory: 400Mi
  limits:
    cpu: 400m
    memory: 400Mi

# For multiple replicas, set at most one budget. Both null defaults to minAvailable: 1.
pdb:
  enabled: true
  minAvailable: null
  maxUnavailable: null

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: false
  runAsUser: 1002

# Empty affinity applies soft pod anti-affinity when replicas > 1.
affinity: {}
nodeSelector: {}
tolerations: []
topologySpreadConstraints: []
terminationGracePeriodSeconds: 10

# WATCH_NAMESPACE is managed by scope; other environment variables may be added here.
extraEnv: []

# The operator listens on port 9443.
webhook:
  failurePolicy: Fail
  certificateSecretName: webhook-server-cert
  timeoutSeconds: 10
