# Create OCI configuration in databases; oci-privatekey must contain privatekey.
# Replace the example identifiers before installing.
scope:
  mode: namespace
  watchNamespaces: [databases]
ociCredentials:
  - namespace: databases
    configMapName: oci-cred
    existingSecretName: oci-privatekey
    tenancy: ocid1.tenancy.oc1..example
    user: ocid1.user.oc1..example
    fingerprint: "00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00"
    region: uk-london-1
