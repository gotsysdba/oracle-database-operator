{{- $name := printf "%s-crd-configuration" (include "oracle-database-operator.name" .) -}}
{{- $crds := list -}}
{{- $conversionCrds := list -}}
{{- range $path, $_ := .Files.Glob "crds/*.yaml" -}}
{{- $crd := fromYaml ($.Files.Get $path) -}}
{{- $crds = append $crds $crd.metadata.name -}}
{{- if eq (dig "conversion" "strategy" "" $crd.spec) "Webhook" -}}
{{- $conversionCrds = append $conversionCrds $crd.metadata.name -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "oracle-database-operator.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
rules:
- apiGroups: [apiextensions.k8s.io]
  resources: [customresourcedefinitions]
  resourceNames:
  {{- range $crds }}
  - {{ . }}
  {{- end }}
  verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ include "oracle-database-operator.namespace" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ include "oracle-database-operator.namespace" . }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: certificate-references
        image: {{ .Values.crdConfiguration.image | quote }}
        imagePullPolicy: {{ .Values.crdConfiguration.imagePullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        command: [kubectl]
        args:
        - patch
        {{- range $crds }}
        - customresourcedefinition/{{ . }}
        {{- end }}
        - --type=merge
        - --patch
        - {{ dict "metadata" (dict "annotations" (dict "cert-manager.io/inject-ca-from" (include "oracle-database-operator.certManagerInjectAnnotation" .))) | toJson | quote }}
      containers:
      - name: conversion-references
        image: {{ .Values.crdConfiguration.image | quote }}
        imagePullPolicy: {{ .Values.crdConfiguration.imagePullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        command: [kubectl]
        args:
        - patch
        {{- range $conversionCrds }}
        - customresourcedefinition/{{ . }}
        {{- end }}
        - --type=merge
        - --patch
        - {{ dict "spec" (dict "conversion" (dict "webhook" (dict "clientConfig" (dict "service" (dict "name" (include "oracle-database-operator.webhookServiceName" .) "namespace" (include "oracle-database-operator.namespace" .)))))) | toJson | quote }}
