{{- $resources := dict -}}
{{- range .Values.ociCredentials }}
{{- if and (eq $.Values.scope.mode "namespace") (not (has .namespace $.Values.scope.watchNamespaces)) }}
{{- fail (printf "ociCredentials namespace %q must be in scope.watchNamespaces" .namespace) }}
{{- end }}
{{- $configMapName := default "oci-cred" .configMapName }}
{{- $secretName := default "oci-privatekey" .secretName }}
{{- $identities := list (printf "ConfigMap/%s/%s" .namespace $configMapName) }}
{{- if .privateKey }}
{{- $identities = append $identities (printf "Secret/%s/%s" .namespace $secretName) }}
{{- end }}
{{- range $identities }}
{{- if hasKey $resources . }}
{{- fail (printf "ociCredentials defines duplicate resource %s" .) }}
{{- end }}
{{- $_ := set $resources . true }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $configMapName }}
  namespace: {{ .namespace }}
  labels:
    {{- include "oracle-database-operator.labels" $ | nindent 4 }}
data:
  tenancy: {{ .tenancy | quote }}
  user: {{ .user | quote }}
  fingerprint: {{ .fingerprint | quote }}
  region: {{ .region | quote }}
  {{- with .passphrase }}
  passphrase: {{ . | quote }}
  {{- end }}
{{- if .privateKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .namespace }}
  labels:
    {{- include "oracle-database-operator.labels" $ | nindent 4 }}
type: Opaque
data:
  privatekey: {{ .privateKey | b64enc | quote }}
{{- end }}
{{- end }}
