{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oracle-database-operator.clusterName" . }}-manager-role
  labels:
    {{- include "oracle-database-operator.labels" . | nindent 4 }}
rules:
# Core API group resources
- apiGroups:
  - ""
  resources:
  - configmaps
  - endpoints
  - events
  - persistentvolumeclaims
  - pods
  - pods/exec
  - pods/log
  - secrets
  - serviceaccounts
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps/status
  - persistentvolumeclaims/status
  - services/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - secrets/status
  verbs:
  - get
# Apps API group resources
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - daemonsets/status
  - deployments/status
  - statefulsets/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - statefulsets/finalizers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Oracle Database CRDs
- apiGroups:
  - database.oracle.com
  resources:
  - autonomouscontainerdatabases
  - autonomousdatabases
  - dataguardbrokers
  - dbcssystems
  - events
  - lrests
  - lrpdbs
  - oraclerestarts
  - oraclerestdataservices
  - ordssrvs
  - racdatabases
  - shardingdatabases
  - singleinstancedatabases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - database.oracle.com
  resources:
  - autonomouscontainerdatabases/status
  - autonomousdatabasebackups/status
  - autonomousdatabaserestores/status
  - dataguardbrokers/status
  - dbcssystems/status
  - lrests/status
  - lrpdbs/status
  - oraclerestarts/status
  - oraclerestdataservices/status
  - ordssrvs/status
  - racdatabases/status
  - shardingdatabases/status
  - singleinstancedatabases/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - database.oracle.com
  resources:
  - autonomousdatabasebackups
  - autonomousdatabaserestores
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
- apiGroups:
  - database.oracle.com
  resources:
  - autonomousdatabases/status
  verbs:
  - patch
  - update
- apiGroups:
  - database.oracle.com
  resources:
  - dataguardbrokers/finalizers
  - lrests/finalizers
  - oraclerestdataservices/finalizers
  - ordssrvs/finalizers
  - singleinstancedatabases/finalizers
  verbs:
  - update
- apiGroups:
  - database.oracle.com
  resources:
  - dbcssystems/finalizers
  - lrpdbs/configmaps
  - lrpdbs/finalizers
  - oraclerestarts/finalizers
  - racdatabases/finalizers
  - shardingdatabases/finalizers
  verbs:
  - create
  - delete
  - get
  - patch
  - update
# Oracle Traffic Manager CRD
- apiGroups:
  - network.oracle.com
  resources:
  - trafficmanagers
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - network.oracle.com
  resources:
  - trafficmanagers/status
  verbs:
  - get
  - patch
  - update
# Prometheus Operator resources
- apiGroups:
  - monitoring.coreos.com
  resources:
  - servicemonitors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Oracle Observability CRDs
- apiGroups:
  - observability.oracle.com
  resources:
  - databaseobservers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - observability.oracle.com
  resources:
  - databaseobservers/finalizers
  verbs:
  - update
- apiGroups:
  - observability.oracle.com
  resources:
  - databaseobservers/status
  verbs:
  - get
  - patch
  - update
# Private AI CRD
- apiGroups:
  - privateai.oracle.com
  resources:
  - privateais
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - privateai.oracle.com
  resources:
  - privateais/finalizers
  verbs:
  - update
- apiGroups:
  - privateai.oracle.com
  resources:
  - privateais/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oracle-database-operator.clusterName" . }}-metrics-reader
  labels:
    {{- include "oracle-database-operator.labels" . | nindent 4 }}
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oracle-database-operator.clusterName" . }}-proxy-role
  labels:
    {{- include "oracle-database-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
{{- end }}
